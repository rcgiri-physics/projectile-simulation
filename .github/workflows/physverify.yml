name: physverify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rcgiri-physics/physverify@v0.6.0
        with:
          specs: tests/verify_*.py
          install: numpy  # the spec stubs matplotlib, so the plotting stack is not needed
